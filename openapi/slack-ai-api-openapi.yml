openapi: 3.1.0
info:
  version: '1.0'
  title: Slack Admin Access AI API
  description: "The Slack Admin API is a set of privileged endpoints\x14primarily under admin.* with related SCIM and Audit Logs APIs\x14that lets Enterprise Grid owners and admins automate organization\x11 wide management and governance. It covers user lifecycle (provision, suspend, assign roles), workspace and channel administration across workspaces (create, move, archive channels; manage membership and settings), app governance (approve/deny or allowlist/ban apps and install them to workspaces), invite request handling, and security/compliance controls such as information barriers, session and authentication policies, and org\x11level analytics exports. These APIs require elevated admin scopes and are commonly used to power automated onboarding/offboarding, centralized channel and app controls, and integrations with identity, ITSM, and compliance systems."
tags:
- name: AI
paths:
  /assistant.threads.setStatus:
    post:
      tags:
      - AI
      summary: Set Assistant Thread Status
      description: Sets the status of a Slack AI assistant thread, for example showing a thinking indicator.
      operationId: postAssistantThreadsSetStatus
      parameters:
      - name: token
        in: header
        description: 'Authentication token. Requires scope: `assistant:write`'
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - channel_id
              - thread_ts
              - status
              type: object
              properties:
                channel_id:
                  type: string
                  description: The channel ID of the assistant thread.
                thread_ts:
                  type: string
                  description: The thread timestamp of the assistant thread.
                status:
                  type: string
                  description: The status of the assistant thread (e.g., "is thinking...").
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
              example:
                ok: false
                error: invalid_auth
      security:
      - slackAuth:
        - assistant:write
  /assistant.threads.setSuggestedPrompts:
    post:
      tags:
      - AI
      summary: Set Assistant Thread Suggested Prompts
      description: Sets the suggested prompts for a Slack AI assistant thread.
      operationId: postAssistantThreadsSetSuggestedPrompts
      parameters:
      - name: token
        in: header
        description: 'Authentication token. Requires scope: `assistant:write`'
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - channel_id
              - thread_ts
              - prompts
              type: object
              properties:
                channel_id:
                  type: string
                  description: The channel ID of the assistant thread.
                thread_ts:
                  type: string
                  description: The thread timestamp of the assistant thread.
                prompts:
                  type: string
                  description: JSON-encoded array of suggested prompt objects with title and message fields.
                title:
                  type: string
                  description: An optional title to show above the suggested prompts.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
              example:
                ok: false
                error: invalid_auth
      security:
      - slackAuth:
        - assistant:write
  /assistant.threads.setTitle:
    post:
      tags:
      - AI
      summary: Set Assistant Thread Title
      description: Sets the title of a Slack AI assistant thread.
      operationId: postAssistantThreadsSetTitle
      parameters:
      - name: token
        in: header
        description: 'Authentication token. Requires scope: `assistant:write`'
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - channel_id
              - thread_ts
              - title
              type: object
              properties:
                channel_id:
                  type: string
                  description: The channel ID of the assistant thread.
                thread_ts:
                  type: string
                  description: The thread timestamp of the assistant thread.
                title:
                  type: string
                  description: The title to set for the assistant thread.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
              example:
                ok: false
                error: invalid_auth
      security:
      - slackAuth:
        - assistant:write
