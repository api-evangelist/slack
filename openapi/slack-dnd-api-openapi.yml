openapi: 3.1.0
info:
  version: '1.0'
  title: Slack Admin Access Dnd API
  description: "The Slack Admin API is a set of privileged endpoints\x14primarily under admin.* with related SCIM and Audit Logs APIs\x14that lets Enterprise Grid owners and admins automate organization\x11 wide management and governance. It covers user lifecycle (provision, suspend, assign roles), workspace and channel administration across workspaces (create, move, archive channels; manage membership and settings), app governance (approve/deny or allowlist/ban apps and install them to workspaces), invite request handling, and security/compliance controls such as information barriers, session and authentication policies, and org\x11level analytics exports. These APIs require elevated admin scopes and are commonly used to power automated onboarding/offboarding, centralized channel and app controls, and integrations with identity, ITSM, and compliance systems."
tags:
- name: Dnd
  description: Do Not Disturb management
paths:
  /dnd.setSnooze:
    post:
      tags:
      - Dnd
      summary: Slack Set Snooze Duration
      description: Turns on Do Not Disturb mode for the current user for the specified number of minutes.
      operationId: dndSetSnooze
      externalDocs:
        description: API method documentation
        url: https://docs.slack.dev/reference/methods/dnd.setSnooze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - num_minutes
              properties:
                num_minutes:
                  type: integer
                  description: Number of minutes to snooze for.
      responses:
        '200':
          description: Snooze set
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  snooze_enabled:
                    type: boolean
                  snooze_endtime:
                    type: integer
                  snooze_remaining:
                    type: integer
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /dnd.info:
    get:
      tags:
      - Dnd
      summary: Slack Get Dnd Status for a User
      description: Retrieves a user's current Do Not Disturb status.
      operationId: dndInfo
      externalDocs:
        description: API method documentation
        url: https://docs.slack.dev/reference/methods/dnd.info
      parameters:
      - name: user
        in: query
        description: User to fetch status for.
        schema:
          type: string
      responses:
        '200':
          description: DND info retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  dnd_enabled:
                    type: boolean
                  next_dnd_start_ts:
                    type: integer
                  next_dnd_end_ts:
                    type: integer
                  snooze_enabled:
                    type: boolean
                  snooze_endtime:
                    type: integer
                  snooze_remaining:
                    type: integer
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
