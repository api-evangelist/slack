openapi: 3.1.0
info:
  version: '1.0'
  title: Slack Admin Access Sections API
  description: "The Slack Admin API is a set of privileged endpoints\x14primarily under admin.* with related SCIM and Audit Logs APIs\x14that lets Enterprise Grid owners and admins automate organization\x11 wide management and governance. It covers user lifecycle (provision, suspend, assign roles), workspace and channel administration across workspaces (create, move, archive channels; manage membership and settings), app governance (approve/deny or allowlist/ban apps and install them to workspaces), invite request handling, and security/compliance controls such as information barriers, session and authentication policies, and org\x11level analytics exports. These APIs require elevated admin scopes and are commonly used to power automated onboarding/offboarding, centralized channel and app controls, and integrations with identity, ITSM, and compliance systems."
tags:
- name: Sections
paths:
  /canvases.sections.lookup:
    post:
      tags:
      - Sections
      summary: Lookup Canvas Sections
      description: Looks up sections in a canvas by type or criteria.
      operationId: postCanvasesSectionsLookup
      parameters:
      - name: token
        in: header
        description: 'Authentication token. Requires scope: `canvases:read`'
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - canvas_id
              - criteria
              type: object
              properties:
                canvas_id:
                  type: string
                  description: ID of the canvas to search in.
                criteria:
                  type: object
                  description: Search criteria for finding sections.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sections:
                    type: array
                    items:
                      type: object
              example:
                ok: true
                sections: []
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
              example:
                ok: false
                error: canvas_not_found
      security:
      - slackAuth:
        - canvases:read
