                type: object
                properties:
                  bot:
                    type: object
                    additionalProperties: false
                  ok:
                    $ref: '#/components/schemas/defs_ok_true'
                additionalProperties: false
                description: Schema for successful response from bots.info method
              example:
                bot:
                  app_id: A161CLERW
                  deleted: false
                  icons:
                    image_36: https://...
                    image_48: https://...
                    image_72: https://...
                  id: B061F7JD2
                  name: beforebot
                  updated: 1449272004
