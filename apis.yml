aid: slack
url: https://raw.githubusercontent.com/api-search/messaging/main/_apis/slack/apis.md
apis:
- aid: slack:slack-events-api
  name: Slack Events API
  tags:
  - Events
  - Real Time
  - Webhooks
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://slack.com/api
  humanURL: https://docs.slack.dev/apis/events-api
  properties:
  - url: https://docs.slack.dev/apis/events-api
    type: Documentation
  - url: https://docs.slack.dev/apis/events-api/using-socket-mode
    type: SocketMode
  - url: https://docs.slack.dev/apis/events-api/comparing-http-socket-mode
    type: Guide
  - url: asyncapi/slack-events-asyncapi.yml
    type: AsyncAPI
  description: >-
    The Slack Events API enables apps to respond to activities in Slack by subscribing to specific event
    types. Rather than polling for changes, apps receive HTTP POST payloads when subscribed events occur,
    such as new messages, reactions, channel changes, or user updates. The Events API offers two delivery
    options - a public HTTP endpoint that Slack sends event payloads to, or Socket Mode which uses WebSockets
    for apps that cannot expose a public URL.
- aid: slack:slack-scim-api
  name: Slack SCIM API
  tags:
  - Enterprise
  - Identity
  - Provisioning
  - SCIM
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.slack.com/scim/v1
  humanURL: https://docs.slack.dev/admins/scim-api
  properties:
  - url: https://docs.slack.dev/admins/scim-api
    type: Documentation
  - url: https://docs.slack.dev/reference/scim-api
    type: APIReference
  description: >-
    The Slack SCIM API lets teams on Plus and Enterprise plans provision and manage user accounts and
    groups programmatically using the SCIM (System for Cross-domain Identity Management) protocol. It
    supports both SCIM v1.1 and v2.0, enabling identity providers and SSO services to automate user lifecycle
    management including creating, updating, deactivating, and deleting users, as well as creating and
    managing groups.
- aid: slack:slack-audit-logs-api
  name: Slack Audit Logs API
  tags:
  - Audit Logs
  - Compliance
  - Enterprise
  - Security
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.slack.com/audit/v1
  humanURL: https://docs.slack.dev/admins/audit-logs-api
  properties:
  - url: https://docs.slack.dev/admins/audit-logs-api
    type: Documentation
  - url: https://docs.slack.dev/reference/audit-logs-api/methods-actions-reference
    type: APIReference
  description: >-
    The Slack Audit Logs API is designed for building security information and event management (SIEM)
    tools for Slack Enterprise Grid organizations. It provides a read-only view of audit events happening
    across an entire Enterprise organization, including user actions, admin actions, app installations,
    file sharing, and authentication events. The primary endpoint at /audit/v1/logs returns a list of
    auditable actions that have occurred, with filtering by action type, actor, entity, and date range.
- aid: slack:slack-incoming-webhooks-api
  name: Slack Incoming Webhooks API
  tags:
  - Messaging
  - Webhooks
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://hooks.slack.com
  humanURL: https://docs.slack.dev/messaging/sending-messages-using-incoming-webhooks
  properties:
  - url: https://docs.slack.dev/messaging/sending-messages-using-incoming-webhooks
    type: Documentation
  description: >-
    Slack Incoming Webhooks provide a simple way to post messages from external sources into Slack. Creating
    an incoming webhook gives you a unique URL to which you send a JSON payload with the message text
    and formatting options. Messages can be plain text or use Block Kit for rich formatting with interactive
    components.
- aid: slack:slack-slash-commands-api
  name: Slack Slash Commands API
  tags:
  - Commands
  - Interactivity
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://slack.com/api
  humanURL: https://docs.slack.dev/interactivity/slash-commands
  properties:
  - url: https://docs.slack.dev/interactivity/slash-commands
    type: Documentation
  description: >-
    Slack Slash Commands allow users to invoke app functionality directly from the message composer box
    by typing a forward slash followed by a command name and optional parameters. When a user triggers
    a slash command, Slack sends an HTTP POST request to the app's configured Request URL with details
    about the command, user, channel, and any text entered. The app can respond with a message (visible
    to everyone or only to the invoking user), open a modal, or trigger other interactive flows.
- aid: slack:slack-app-manifest-api
  name: Slack App Manifest API
  tags:
  - App Manifest
  - Configuration
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://slack.com/api
  humanURL: https://docs.slack.dev/app-manifests
  properties:
  - url: https://docs.slack.dev/app-manifests
    type: Documentation
  - url: https://docs.slack.dev/reference/app-manifest
    type: APIReference
  description: >-
    The Slack App Manifest API provides methods to programmatically create, configure, update, export,
    validate, and delete Slack apps using JSON or YAML manifest files. Key methods include apps.manifest.create
    for creating new apps from a manifest, apps.manifest.update for modifying existing app configurations,
    apps.manifest.export for exporting an app's current configuration, apps.manifest.validate for validating
    manifest syntax before applying changes, and apps.manifest.delete for removing apps.
- aid: slack:slack-interactivity-api
  name: Slack Interactivity API
  tags:
  - Block Kit
  - Components
  - Interactivity
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://slack.com/api
  humanURL: https://docs.slack.dev/interactivity
  properties:
  - url: https://docs.slack.dev/interactivity
    type: Documentation
  - url: https://docs.slack.dev/interactivity/handling-user-interaction
    type: Guide
  - url: https://docs.slack.dev/block-kit
    type: BlockKit
  description: >-
    The Slack Interactivity API encompasses the mechanisms by which Slack apps handle user interactions
    with interactive components such as buttons, menus, date pickers, modals, shortcuts, and other Block
    Kit elements. When a user interacts with these components, Slack sends an interaction payload to the
    app's configured Request URL or via Socket Mode.
